[project]
name = "tackboard-mcp"
version = "0.1.0"
description = "Optional MCP adapter for the tackboard CLI — exposes board tools to MCP clients"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["tackboard>=0.7.2,<0.8", "mcp>=2.3,<3"]

[tool.uv.sources]
tackboard = { workspace = true }

[project.scripts]
tackboard-mcp = "tackboard_mcp.server:main"

[build-system]
requires = ["uv_build>=0.7,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tackboard_mcp"
