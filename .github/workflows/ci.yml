name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: ${{ matrix.python-version }}
          version: 0.12.5

      - name: Sync dependencies (frozen)
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uvx ruff check src tests

      - name: Type check (mypy)
        run: uv run mypy src

      - name: Test
        run: uv run pytest -q

      - name: JSON Schemas match real CLI output (in process)
        run: uv run python scripts/validate_schemas.py --tack "uv run tack"

      - name: Install the console script
        run: uv tool install --force .

      - name: JSON Schemas match real CLI output (installed console script)
        run: uv run python scripts/validate_schemas.py --tack "$(uv tool dir --bin)/tack"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"
          version: 0.12.5

      - name: Build sdist and wheel
        run: uv build

      - name: Check the distributions ship the JSON Schemas
        run: |
          set -euo pipefail
          test "$(unzip -l dist/*.whl | rg -c 'tackboard/schemas/[a-z_]+\.json')" -ge 24
          test "$(tar tzf dist/*.tar.gz | rg -c 'tackboard/schemas/[a-z_]+\.json')" -ge 24

      - name: Check distributions
        run: uvx twine check dist/*
