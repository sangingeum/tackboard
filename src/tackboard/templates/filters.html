<form class="filters" method="get" action="/board" role="search" aria-label="Filter tasks">
  <div class="filters__chips" role="group" aria-label="Active filters">
    $chips
  </div>
  <details class="filters__more">
    <summary class="chip chip--add">Add filter</summary>
    <fieldset class="filters__panel">
      <legend>Status</legend>
      $status_radios
      <label for="filter-priority">priority</label>
      <select id="filter-priority" name="priority">
        <option value="">any</option>
        $priority_options
      </select>
      <label for="filter-assignee">assignee</label>
      <input id="filter-assignee" type="text" name="assignee" value="$assignee">
      <label for="filter-label">label</label>
      <input id="filter-label" type="text" name="label" value="$label">
      <label class="inline"><input type="checkbox" name="blocked" value="1"$blocked_checked> blocked</label>
      <label class="inline"><input type="checkbox" name="eligible" value="1"$eligible_checked> eligible</label>
      <button type="submit">Apply</button>
      <a class="reset" href="/board">Reset all</a>
    </fieldset>
  </details>
</form>
