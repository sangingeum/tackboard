<li class="card card-$status">
  <a class="card-id" href="/task/$id">$id</a>
  <span class="card-title">$title</span>
  <span class="card-meta">
    <span class="badge badge-status">$status</span>
    <span class="badge badge-priority priority-$priority">$priority</span>
    <span class="card-assignee">$assignee</span>
  </span>
  <span class="card-labels">$labels</span>
  <span class="card-flags">$flags</span>
</li>
