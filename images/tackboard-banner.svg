<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">tackboard</title>
  <desc id="d">A cork board with index cards pinned to it and connected by string, showing tasks in a dependency graph for AI agents. A terminal card shows the commands tack next --claim --json and tack complete.</desc>

  <defs>
    <!-- cork texture -->
    <filter id="cork" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7" result="n1"/>
      <feColorMatrix in="n1" type="matrix" values="0 0 0 0 0.30  0 0 0 0 0.18  0 0 0 0 0.07  0 0 0 -2.2 1.35" result="dark"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="2" seed="21" result="n2"/>
      <feColorMatrix in="n2" type="matrix" values="0 0 0 0 0.93  0 0 0 0 0.78  0 0 0 0 0.55  0 0 0 -2.4 1.2" result="light"/>
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="dark"/>
        <feMergeNode in="light"/>
      </feMerge>
    </filter>

    <radialGradient id="vignette" cx="50%" cy="48%" r="75%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#2a1604" stop-opacity="0.38"/>
    </radialGradient>

    <filter id="shadow" x="-10%" y="-10%" width="125%" height="135%">
      <feDropShadow dx="2" dy="5" stdDeviation="3.5" flood-color="#2a1604" flood-opacity="0.45"/>
    </filter>

    <!-- tack: color comes from the `color` attribute on <use> -->
    <g id="tack">
      <ellipse cx="3" cy="6" rx="8" ry="4.5" fill="#2a1604" opacity="0.35"/>
      <circle r="8.5" fill="currentColor"/>
      <circle r="8.5" fill="none" stroke="#000" stroke-opacity="0.25" stroke-width="1.5"/>
      <circle cx="-2.6" cy="-2.8" r="3" fill="#fff" opacity="0.55"/>
    </g>

    <!-- nail the string is wrapped around -->
    <g id="nail">
      <circle r="4.2" fill="#3a3f49"/>
      <circle cx="-1.2" cy="-1.2" r="1.4" fill="#d5d9e0"/>
    </g>
  </defs>

  <style>
    .sans { font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .id    { font-size: 12px; fill: #7a6f57; }
    .name  { font-size: 16px; font-weight: 700; fill: #1f2430; }
    .stat  { font-size: 13px; font-weight: 600; }
    .done  { fill: #2f7a49; }
    .claim { fill: #2d5cb8; }
    .elig  { fill: #a86f00; }
    .block { fill: #b03226; }
    .string { fill: none; stroke: #263042; stroke-width: 2.6; stroke-linecap: round; }
    .wait   { stroke-dasharray: 7 6; }
    .sshadow { fill: none; stroke: #2a1604; stroke-opacity: 0.28; stroke-width: 3; stroke-linecap: round; }
  </style>

  <!-- board -->
  <rect width="1280" height="640" fill="#c39561" filter="url(#cork)"/>
  <rect width="1280" height="640" fill="url(#vignette)"/>
  <rect x="12" y="12" width="1256" height="616" fill="none" stroke="#5e4026" stroke-width="24"/>
  <rect x="24" y="24" width="1232" height="592" fill="none" stroke="#2a1604" stroke-opacity="0.35" stroke-width="2"/>
  <rect x="0.5" y="0.5" width="1279" height="639" fill="none" stroke="#3b2713" stroke-opacity="0.6"/>

  <!-- ===== strings (dependencies). solid = prerequisite is done, dashed = still waiting ===== -->
  <g transform="translate(2,3)">
    <path class="sshadow" d="M760 162 C800 162 790 112 830 112"/>
    <path class="sshadow" d="M760 162 C800 162 790 372 830 372"/>
    <path class="sshadow" d="M760 432 C800 432 790 372 830 372"/>
    <path class="sshadow wait" d="M1000 112 C1040 112 1030 222 1070 222"/>
    <path class="sshadow wait" d="M1000 372 C1040 372 1030 222 1070 222"/>
    <path class="sshadow wait" d="M1000 372 C1040 372 1030 462 1070 462"/>
  </g>
  <path class="string" d="M760 162 C800 162 790 112 830 112"/>
  <path class="string" d="M760 162 C800 162 790 372 830 372"/>
  <path class="string" d="M760 432 C800 432 790 372 830 372"/>
  <path class="string wait" d="M1000 112 C1040 112 1030 222 1070 222"/>
  <path class="string wait" d="M1000 372 C1040 372 1030 222 1070 222"/>
  <path class="string wait" d="M1000 372 C1040 372 1030 462 1070 462"/>

  <!-- ===== task cards ===== -->
  <!-- A: done -->
  <g transform="rotate(-1.5 675 162)" filter="url(#shadow)">
    <rect x="590" y="110" width="170" height="104" rx="3" fill="#f8f3e6"/>
    <line x1="602" y1="148" x2="748" y2="148" stroke="#e6dcc0"/>
    <text x="602" y="140" class="mono id">T-000101</text>
    <text x="602" y="174" class="sans name">Design schema</text>
    <path d="M603 196 l3 3 l6 -7" stroke="#2f7a49" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="622" y="200" class="sans stat done">done</text>
    <use href="#tack" xlink:href="#tack" x="675" y="119" color="#3e8e5a"/>
  </g>

  <!-- B: done -->
  <g transform="rotate(1.2 675 432)" filter="url(#shadow)">
    <rect x="590" y="380" width="170" height="104" rx="3" fill="#f8f3e6"/>
    <line x1="602" y1="418" x2="748" y2="418" stroke="#e6dcc0"/>
    <text x="602" y="410" class="mono id">T-000102</text>
    <text x="602" y="444" class="sans name">SQLite layer</text>
    <path d="M603 466 l3 3 l6 -7" stroke="#2f7a49" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="622" y="470" class="sans stat done">done</text>
    <use href="#tack" xlink:href="#tack" x="675" y="389" color="#3e8e5a"/>
  </g>

  <!-- C: eligible -->
  <g transform="rotate(1 915 112)" filter="url(#shadow)">
    <rect x="830" y="60" width="170" height="104" rx="3" fill="#f8f3e6" stroke="#e0a526" stroke-width="2.5"/>
    <line x1="842" y1="98" x2="988" y2="98" stroke="#e6dcc0"/>
    <text x="842" y="90" class="mono id">T-000103</text>
    <text x="842" y="124" class="sans name">CLI commands</text>
    <path d="M844 141 l9 5 l-9 5 z" fill="#a86f00"/>
    <text x="862" y="152" class="sans stat elig">eligible</text>
    <use href="#tack" xlink:href="#tack" x="915" y="69" color="#e0a526"/>
  </g>

  <!-- D: claimed -->
  <g transform="rotate(-1.2 915 372)" filter="url(#shadow)">
    <rect x="830" y="320" width="170" height="104" rx="3" fill="#f8f3e6"/>
    <line x1="842" y1="358" x2="988" y2="358" stroke="#e6dcc0"/>
    <text x="842" y="350" class="mono id">T-000104</text>
    <text x="842" y="384" class="sans name">Claim locking</text>
    <circle cx="848" cy="406" r="5.5" fill="none" stroke="#2d5cb8" stroke-width="2"/>
    <circle cx="848" cy="406" r="2" fill="#2d5cb8"/>
    <text x="860" y="410" class="sans stat claim">claimed by agent-2</text>
    <use href="#tack" xlink:href="#tack" x="915" y="329" color="#3b6fd1"/>
  </g>

  <!-- E: blocked -->
  <g transform="rotate(1.5 1155 222)" filter="url(#shadow)">
    <rect x="1070" y="170" width="170" height="104" rx="3" fill="#f8f3e6"/>
    <line x1="1082" y1="208" x2="1228" y2="208" stroke="#e6dcc0"/>
    <text x="1082" y="200" class="mono id">T-000105</text>
    <text x="1082" y="234" class="sans name">Web board</text>
    <path d="M1084 252 l8 8 m0 -8 l-8 8" stroke="#b03226" stroke-width="2.2" stroke-linecap="round"/>
    <text x="1100" y="260" class="sans stat block">blocked by 2 tasks</text>
    <use href="#tack" xlink:href="#tack" x="1155" y="179" color="#c0392b"/>
  </g>

  <!-- F: blocked -->
  <g transform="rotate(-0.8 1155 462)" filter="url(#shadow)">
    <rect x="1070" y="410" width="170" height="104" rx="3" fill="#f8f3e6"/>
    <line x1="1082" y1="448" x2="1228" y2="448" stroke="#e6dcc0"/>
    <text x="1082" y="440" class="mono id">T-000106</text>
    <text x="1082" y="474" class="sans name">Write docs</text>
    <path d="M1084 492 l8 8 m0 -8 l-8 8" stroke="#b03226" stroke-width="2.2" stroke-linecap="round"/>
    <text x="1100" y="500" class="sans stat block">blocked by 1 task</text>
    <use href="#tack" xlink:href="#tack" x="1155" y="419" color="#c0392b"/>
  </g>

  <!-- nails where strings are wrapped -->
  <use href="#nail" xlink:href="#nail" x="760" y="162"/>
  <use href="#nail" xlink:href="#nail" x="760" y="432"/>
  <use href="#nail" xlink:href="#nail" x="830" y="112"/>
  <use href="#nail" xlink:href="#nail" x="830" y="372"/>
  <use href="#nail" xlink:href="#nail" x="1000" y="112"/>
  <use href="#nail" xlink:href="#nail" x="1000" y="372"/>
  <use href="#nail" xlink:href="#nail" x="1070" y="222"/>
  <use href="#nail" xlink:href="#nail" x="1070" y="462"/>

  <!-- ===== title card ===== -->
  <g transform="rotate(-1.5 285 195)" filter="url(#shadow)">
    <rect x="60" y="80" width="450" height="230" rx="3" fill="#f8f3e6"/>
    <text x="92" y="170" class="sans" font-size="68" font-weight="800" letter-spacing="-2" fill="#1f2430">tackboard</text>
    <text x="93" y="216" class="sans" font-size="22" font-weight="600" fill="#1f2430">A shared task board for AI agents.</text>
    <text x="93" y="254" class="sans" font-size="15" fill="#5c5342">One SQLite file per project, a CLI that speaks JSON,</text>
    <text x="93" y="276" class="sans" font-size="15" fill="#5c5342">and a read-only board for the human watching.</text>
    <use href="#tack" xlink:href="#tack" x="285" y="89" color="#8a8f98"/>
  </g>

  <!-- ===== terminal card ===== -->
  <g transform="rotate(1.2 290 420)" filter="url(#shadow)">
    <rect x="70" y="350" width="440" height="130" rx="4" fill="#1e2327"/>
    <text x="94" y="394" class="mono" font-size="14" fill="#e8e6df"><tspan fill="#7fd18b">$</tspan> tack next --claim --json</text>
    <text x="94" y="422" class="mono" font-size="14" fill="#9cb4c9">{"task":"T-000103","claimed_by":"agent-1"}</text>
    <text x="94" y="458" class="mono" font-size="14" fill="#e8e6df"><tspan fill="#7fd18b">$</tspan> tack complete T-000103</text>
    <use href="#tack" xlink:href="#tack" x="290" y="359" color="#c9ced6"/>
  </g>

  <!-- ===== legend ===== -->
  <g transform="rotate(-0.4 1005 567)" filter="url(#shadow)">
    <rect x="750" y="545" width="490" height="44" rx="3" fill="#f8f3e6"/>
    <circle cx="776" cy="567" r="7" fill="#3e8e5a"/>
    <text x="790" y="572" class="sans" font-size="14" fill="#1f2430">done</text>
    <circle cx="860" cy="567" r="7" fill="#3b6fd1"/>
    <text x="874" y="572" class="sans" font-size="14" fill="#1f2430">claimed</text>
    <circle cx="954" cy="567" r="7" fill="#e0a526"/>
    <text x="968" y="572" class="sans" font-size="14" fill="#1f2430">eligible</text>
    <circle cx="1050" cy="567" r="7" fill="#c0392b"/>
    <text x="1064" y="572" class="sans" font-size="14" fill="#1f2430">blocked</text>
    <path d="M1136 567 h44" stroke="#263042" stroke-width="2.4" stroke-dasharray="6 5" stroke-linecap="round"/>
    <text x="1186" y="572" class="sans" font-size="13" fill="#5c5342">waits</text>
  </g>
</svg>
