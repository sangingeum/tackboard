[project]
name = "tackboard"
version = "0.7.1"
description = "Project-scoped task board for coordinating multiple AI agents: CLI-first, SQLite-backed, with a read-only board and dependency-DAG view"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "sangingeum" }]
keywords = ["task-board", "agents", "sqlite", "cli", "kanban", "dependency-graph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Groupware",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/sangingeum/tackboard"
Repository = "https://github.com/sangingeum/tackboard"

[project.scripts]
tack = "tackboard.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pip-audit>=2.7",
    "pytest-cov>=7.1.0",
    "jsonschema>=4.23",
    "hypothesis>=6.100",
]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# The optional MCP framework belongs to the adapter package's metadata, so the
# core checkout does not install it. Its imports are typed by that package.
module = ["mcp", "mcp.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 96

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "BLE"]

[tool.ruff.lint.per-file-ignores]
# guide.py is generated prose: it carries reference lines verbatim, including
# tables and JSON samples that a line-length rule would break.
"src/tackboard/guide.py" = ["E501", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/tackboard-mcp/tests"]
filterwarnings = ["error"]

[tool.coverage.run]
parallel = true
branch = true

[tool.coverage.report]
fail_under = 70
show_missing = true

[tool.uv]
package = true

[build-system]
requires = ["uv_build>=0.7,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tackboard"
